    <link

      type="image/png"
      sizes="32x32"
      href="../favicon-32x32.png"
    />

    <link
      rel="icon"

    <script src="../script.js" defer></script>

    <style>
      /* ================================
         FESTER ABSTAND ZWISCHEN SEITEN
         ================================ */

      section + section {
        margin-top: 50px;
      }

      /* Verhindert horizontales Verschieben */
      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      /* Bestehendes Layout nicht verändern */
      .page {
        display: contents;
      }

      /* Kein zusätzlicher Abstand durch .page */
      .page + .page {
        margin-top: 0;
      }
      .eingabefeld {
        width: 85%;
      }
    </style>
  </head>

  <body>
    <!-- ================================
         HEADER
         ================================ -->

    <div class="header">
      <a href="../site2.html" id="site2Btn" class="BTN">
        <svg

          />
        </svg>
      </a>

      <h1>Lipids</h1>

      <button type="button" id="resetBtn" class="BTN">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="24"
          width="24"
          viewBox="0 -960 960 960"
          fill="black"
        >
          <path
            d="M440-122q-121-15-200.5-105.5T160-440q0-66 26-126.5T260-672l57 57q-38 34-57.5 79T240-440q0 88 56 155.5T440-202v80Zm80 0v-80q87-16 143.5-83T720-440q0-100-70-170t-170-70h-3l44 44-56 56-140-140 140-140 56 56-44 44h3q134 0 227 93t93 227q0 121-79.5 211.5T520-122Z"
          />
        </svg>
      </button>
    </div>

    <!-- ================================
         FORMULAR
         ================================ -->

    <form>
      <!-- ================================
           PATIENTENDATEN
           ================================ -->

      <h2 class="patient-heading">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="22"
          width="22"
          viewBox="0 -960 960 960"
          fill="#005fa3"
        >
          <path
            d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"
          />
        </svg>

        Patientendaten
      </h2>

      <div class="patient-grid">
        <!-- DATUM -->

        <div class="eingabefeld">
          <label class="einheit-label" for="datum"> Datum </label>

          <input type="date" id="datum" autocomplete="off" />
        </div>

        <!-- PATIENTEN-ID -->

        <div class="eingabefeld">
          <label class="einheit-label" for="patientenId"> Patienten-ID </label>

          <input
            type="text"
            id="patientenId"
            autocomplete="off"
            placeholder="z. B. 10234"
          />
        </div>

        <!-- GEBURTSDATUM -->

        <div class="eingabefeld">
          <label class="einheit-label" for="geburtsdatum"> Geburtsdatum </label>

          <input type="date" id="geburtsdatum" autocomplete="off" />
        </div>

        <!-- GRÖSSE -->

        <div class="eingabefeld">
          <label class="einheit-label" for="groesse"> Größe (cm) </label>

          <input
            type="number"
            id="groesse"
            inputmode="numeric"
            min="0"
            max="250"
            step="1"
            placeholder="–"
          />
        </div>

        <!-- GEWICHT -->

        <div class="eingabefeld">
          <label class="einheit-label" for="gewicht"> Gewicht (kg) </label>

          <input
            type="number"
            id="gewicht"
            inputmode="decimal"
            min="0"
            max="400"
            step="0.1"
            placeholder="–"
          />
        </div>

        <!-- BMI -->

        <div class="eingabefeld">
          <label class="einheit-label" for="bmi"> BMI (kg/m²) </label>

          <input type="text" id="bmi" readonly tabindex="-1" placeholder="–" />
        </div>

        <!-- BLUTDRUCK -->

        <div class="eingabefeld">
          <label class="einheit-label" for="blutdruck">
            Blutdruck (mmHg)
          </label>

          <input
            type="text"
            id="blutdruck"
            inputmode="numeric"
            autocomplete="off"
            placeholder="120/80"
          />
        </div>

        <!-- GESCHLECHT -->

        <div class="eingabefeld">
          <label class="einheit-label" for="geschlecht"> Geschlecht </label>

          <select id="geschlecht">
            <option value="">– bitte wählen –</option>

            <option value="männlich">männlich</option>

            <option value="weiblich">weiblich</option>

            <option value="divers">divers</option>
          </select>
        </div>

        <!-- ZIGARETTEN -->

        <div class="eingabefeld">
          <label class="einheit-label" for="zigaretten">
            Zigaretten / Tag
          </label>

          <input
            type="number"
            id="zigaretten"
            inputmode="numeric"
            min="0"
            max="200"
            step="1"
            placeholder="0"
          />
        </div>

        <!-- FAMILIE -->

        <div class="eingabefeld">
          <label class="einheit-label" for="familie">
            Familie (Anamnese)
          </label>

          <select id="familie">
            <option value="">– bitte wählen –</option>

            <option value="Keine Belastung">Keine Belastung</option>

            <option value="Positiv (1. Grades)">Positiv (1. Grades)</option>

            <option value="Positiv (2. Grades)">Positiv (2. Grades)</option>
          </select>
        </div>

        <!-- SCHRITTE -->

        <div class="eingabefeld">
          <label class="einheit-label" for="schritte"> Schritte / Tag </label>

          <input
            type="number"
            id="schritte"
            inputmode="numeric"
            min="0"
            max="100000"
            step="100"
            placeholder="–"
          />
        </div>

        <!-- ERNÄHRUNG -->

        <div class="eingabefeld">
          <label class="einheit-label" for="ernaehrung"> Ernährung </label>

          <select id="ernaehrung">
            <option value="">– bitte wählen –</option>

            <option value="Ausgewogen">Ausgewogen</option>

            <option value="Mediterran">Mediterran</option>

            <option value="Vegetarisch">Vegetarisch</option>

            <option value="Vegan">Vegan</option>

            <option value="Low Carb">Low Carb</option>

            <option value="Ketogen">Ketogen</option>

            <option value="Ungesund">Ungesund</option>
          </select>
        </div>

        <!-- SCHLAF -->

        <div class="eingabefeld">
          <label class="einheit-label" for="schlaf"> Schlaf (h / Nacht) </label>

          <input
            type="number"
            id="schlaf"
            inputmode="decimal"
            min="0"
            max="24"
            step="0.5"
            placeholder="–"
          />
        </div>
      </div>

      <!-- ================================
           /PATIENTENDATEN
           ================================ -->
    </form>
